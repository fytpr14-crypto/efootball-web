<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB : Mook Mook</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #000;
  color: white;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: linear-gradient(90deg, #111, #222);
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.icon {
  font-size: 20px;
}

/* HERO */
.hero {
  position: relative;
  height: 400px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* พื้นหลัง */
.hero-bg {
  position: absolute;
  inset: 0;
  background: url("bg.jpg") center/cover no-repeat;
  opacity: 0.6;
}

/* ตัวละคร */
.char {
  position: absolute;
  bottom: 0;
  width: 180px;
  opacity: 0;
}

/* ซ้าย */
.char.left {
  left: -200px;
  animation: slideLeft 1s ease forwards;
}

/* ขวา */
.char.right {
  right: -200px;
  animation: slideRight 1s ease forwards;
}

/* animation */
@keyframes slideLeft {
  to {
    left: 20px;
    opacity: 1;
  }
}

@keyframes slideRight {
  to {
    right: 20px;
    opacity: 1;
  }
}

/* TEXT */
.hero-content {
  position: relative;
  text-align: center;
  z-index: 2;
}

.hero h1 {
  font-size: 26px;
  margin-bottom: 10px;
}

.hero p {
  font-size: 14px;
  opacity: 0.8;
}

/* BUTTON */
.btn {
  margin-top: 15px;
  padding: 10px 20px;
  border: none;
  border-radius: 20px;
  background: red;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">FB : Mook Mook</div>
  <div class="icon">🔍</div>
</div>

<section class="hero">

  <div class="hero-bg"></div>

  <!-- ตัวละคร -->
  <img src="left.png" class="char left">
  <img src="right.png" class="char right">

  <!-- ข้อความ -->
  <div class="hero-content">
    <h1>รวมไอดีเทพ ⚽</h1>
    <p>เลือกนักเตะที่ต้องการได้ง่าย ๆ</p>
    <button class="btn">เลือกนักเตะ</button>
  </div>

</section>

</body>
</html>
