<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB : Mook Mook</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #000;
  color: white;
}

/* HEADER (แก้ให้กลาง + ใหญ่) */
.header {
  text-align: center;
  font-size: 36px;
  font-weight: 900;
  padding: 20px 10px;
  letter-spacing: 2px;

  background: linear-gradient(90deg, #00ff88, #00ccff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* HERO */
.hero {
  position: relative;
  height: 350px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* BG */
.hero-bg {
  position: absolute;
  inset: 0;
  background: url("bg.jpg") center/cover no-repeat;
  opacity: 0.5;
}

/* ตัวละคร */
.char {
  position: absolute;
  bottom: 0;
  width: 180px;
  opacity: 0;
}

/* ซ้าย */
.char.left {
  left: -200px;
  animation: slideLeft 1s ease forwards;
}

/* ขวา */
.char.right {
  right: -200px;
  animation: slideRight 1s ease forwards;
}

/* animation */
@keyframes slideLeft {
  to {
    left: 10px;
    opacity: 1;
  }
}

@keyframes slideRight {
  to {
    right: 10px;
    opacity: 1;
  }
}

/* TEXT */
.hero-content {
  position: relative;
  text-align: center;
  z-index: 2;
}

.hero h1 {
  font-size: 24px;
  margin-bottom: 8px;
}

.hero p {
  font-size: 14px;
  opacity: 0.8;
}

/* BUTTON */
.btn {
  margin-top: 10px;
  padding: 8px 18px;
  border: none;
  border-radius: 20px;
  background: red;
  color: white;
  cursor: pointer;
}

/* GRID (8 ช่อง) */
.grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  padding: 10px;
}

/* CARD */
.card img {
  width: 100%;
  border-radius: 6px;
  display: block;
}

/* Tablet */
@media (max-width: 1200px) {
  .grid {
    grid-template-columns: repeat(6, 1fr);
  }
}

/* Mobile */
@media (max-width: 768px) {
  .grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .header {
    font-size: 28px;
  }

  .hero {
    height: 280px;
  }

  .char {
    width: 120px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  FB : Mook Mook
</div>

<!-- HERO -->
<section class="hero">

  <div class="hero-bg"></div>

  <!-- ตัวละคร -->
  <img src="left.png" class="char left">
  <img src="right.png" class="char right">

  <!-- ข้อความ -->
  <div class="hero-content">
    <h1>รวมไอดีเทพ ⚽</h1>
    <p>เลือกนักเตะที่ต้องการได้ง่าย ๆ</p>
    <button class="btn">เลือกนักเตะ</button>
  </div>

</section>

<!-- GRID -->
<div class="grid">

  <!-- ใส่รูปนักเตะ -->
  <div class="card"><img src="figo.jpg"></div>
  <div class="card"><img src="makaay.jpg"></div>
  <div class="card"><img src="koller.jpg"></div>
  <div class="card"><img src="gullit.jpg"></div>
  <div class="card"><img src="nedved.jpg"></div>
  <div class="card"><img src="eto.jpg"></div>
  <div class="card"><img src="pele.jpg"></div>
  <div class="card"><img src="xavi.jpg"></div>

</div>

</body>
</html>
