body {

  font-family: Arial, sans-serif;
  background: #0b1220;

/* HEADER */
.header {
  text-align: center;
  font-size: 34px;
  font-weight: 900;
  padding: 20px;
  background: linear-gradient(90deg, #00ccff, #0066ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* SECTION */
.section {
  padding: 15px;
}

.section-title {
  font-size: 18px;
  margin-bottom: 10px;
  color: #9ecbff;
}

/* GRID (6 ต่อแถว) */
.grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}

/* CARD */
.card {
  background: #101a2f;
  border-radius: 8px;
  overflow: hidden;
  transition: 0.2s;
}

.card img {
  width: 100%;
  display: block;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px #00aaff;
}

/* Tablet */
@media (max-width: 1100px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* Mobile */
@media (max-width: 700px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .header {
    font-size: 26px;
  }
}
</style>
